name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push supersedes the run still going for the same branch.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    # One job per task, so a lint failure does not hide the test results.
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, test]

    name: ${{ matrix.task }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      # @secreto/crypto and @secreto/lib are consumed through ./dist, built by
      # their own `prepare` script — which `--ignore-scripts` skips. Without
      # this, 8 app-server test files die on "Failed to resolve entry for
      # package", and the same import fails to typecheck.
      - name: Build workspace packages
        run: |
          pnpm --filter @secreto/crypto run build
          pnpm --filter @secreto/lib run build

      - run: pnpm -r run ${{ matrix.task }}
